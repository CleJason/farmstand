<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Offline</title>
    <style>
      body {
        margin: 0;
        min-height: 100vh;
        display: flex;
        align-items: center;
        justify-content: center;
        font-family: system-ui, -apple-system, sans-serif;
        background: #fafaf8;
        color: #1c1917;
        text-align: center;
        padding: 24px;
      }
      p { color: #78716c; }
      button {
        margin-top: 12px;
        border: 0;
        border-radius: 9999px;
        padding: 10px 20px;
        font-weight: 600;
        background: #1c1917;
        color: #fff;
      }
    </style>
  </head>
  <body>
    <div>
      <h1>You're offline</h1>
      <p>Check your connection and try again.</p>
      <button onclick="location.reload()">Try again</button>
    </div>
  </body>
</html>
