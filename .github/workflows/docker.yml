name: Build Docker image

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  packages: write


jobs:
  build:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: farmstand
          POSTGRES_PASSWORD: smoketest
          POSTGRES_DB: farmstand
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U farmstand -d farmstand"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    steps:
      - uses: actions/checkout@v4

      # ghcr.io/<owner>/<repo>, lowercase — works for any fork
      - name: Image name
        run: echo "IMAGE=ghcr.io/${GITHUB_REPOSITORY,,}" >> "$GITHUB_ENV"

      - uses: docker/setup-buildx-action@v3

      - id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.IMAGE }}
          tags: |
            type=raw,value=latest
            type=sha

      # Build into the local Docker daemon first so it can be smoke-tested
      - uses: docker/build-push-action@v6
        with:
          context: .
          load: true
          build-args: |
            APP_VERSION=${{ github.sha }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Smoke test (migrations + pages respond)
        run: |
          # Root-owned host folder, like a fresh Unraid appdata bind mount
          sudo mkdir -p /tmp/uploads && sudo chown root:root /tmp/uploads && sudo chmod 755 /tmp/uploads
          docker run -d --name farmstand --network host \
            -v /tmp/uploads:/app/public/uploads \
            -e DATABASE_URL="postgresql://farmstand:smoketest@localhost:5432/farmstand?schema=public" \
            -e AUTH_SECRET="smoke-test-secret-not-used-anywhere-else" \
            -e AUTH_TRUST_HOST=true \
            -e ADMIN_EMAIL=owner@example.com \
            -e NEXTAUTH_URL="http://localhost:3000" \
            "${IMAGE}:latest"

          for i in $(seq 1 30); do
            if curl -s -o /dev/null http://localhost:3000/; then break; fi
            if [ "$(docker inspect -f '{{.State.Running}}' farmstand)" != "true" ]; then
              echo "Container exited"; exit 1
            fi
            sleep 2
          done

          # The app user (PUID:PGID 99:100) must be able to write uploads
          docker exec -u 99:100 farmstand touch /app/public/uploads/.write-test
          echo "Uploads dir writable by 99:100"

          health=$(curl -s http://localhost:3000/api/health)
          echo "GET /api/health -> ${health}"
          echo "$health" | grep -q "${GITHUB_SHA}" || { echo "Image reports wrong version"; exit 1; }

          # Runs before setup is done: static files must not hit the first-run redirect
          icon=$(curl -s -o /dev/null -w '%{http_code} %{content_type}' http://localhost:3000/icon.png)
          echo "GET /icon.png -> ${icon}"
          if [ "$icon" != "200 image/png" ]; then exit 1; fi

          # Installable app (PWA): manifest, generated icons, service worker
          manifest=$(curl -s http://localhost:3000/manifest.webmanifest)
          echo "manifest: ${manifest}" | head -c 300; echo
          echo "$manifest" | grep -q '"display":"standalone"' || { echo "Bad manifest"; exit 1; }
          echo "$manifest" | grep -q '"start_url":"/admin"' || { echo "Manifest should open /admin"; exit 1; }
          for icon_path in "/pwa-icon/192" "/pwa-icon/512?maskable=1" "/pwa-icon/180"; do
            r=$(curl -s -o /dev/null -w '%{http_code} %{content_type}' "http://localhost:3000${icon_path}")
            echo "GET ${icon_path} -> ${r}"
            [ "$r" = "200 image/png" ] || exit 1
          done
          links=$(curl -s http://localhost:3000/.well-known/assetlinks.json)
          echo "GET /.well-known/assetlinks.json -> ${links}"
          [ "$links" = "[]" ] || exit 1
          sw=$(curl -s -o /dev/null -w '%{http_code}' http://localhost:3000/sw.js)
          echo "GET /sw.js -> ${sw}"
          [ "$sw" = "200" ] || exit 1

          # Setup wizard must refuse emails that aren't ADMIN_EMAIL
          code=$(curl -s -o /tmp/setup.json -w '%{http_code}' -X POST http://localhost:3000/api/setup \
            -H 'Content-Type: application/json' \
            -d '{"adminEmail":"intruder@example.com","adminName":"X","appUrl":"http://localhost:3000"}')
          echo "POST /api/setup (wrong email) -> ${code} $(cat /tmp/setup.json)"
          [ "$code" = "403" ] || exit 1

          for path in / /setup; do
            code=$(curl -s -o /dev/null -w '%{http_code}' "http://localhost:3000${path}")
            echo "GET ${path} -> ${code}"
            if [ "$code" = "000" ] || [ "$code" -ge 500 ]; then exit 1; fi
          done

          # Tailwind must actually be compiled into the served stylesheet
          css_path=$(curl -sL http://localhost:3000/ | grep -o '/_next/static/[^"]*\.css' | head -n 1)
          if [ -z "$css_path" ]; then echo "No stylesheet linked from /"; exit 1; fi
          css=$(curl -s "http://localhost:3000${css_path}")
          echo "Stylesheet ${css_path}: ${#css} bytes"
          for cls in '.flex{' '.rounded-xl{'; do
            if ! printf '%s' "$css" | grep -qF "$cls"; then
              echo "Stylesheet is missing ${cls} - Tailwind did not compile"; exit 1
            fi
          done

      - name: Pickup time slots (seeded drop, real orders)
        env:
          PGURL: postgresql://farmstand:smoketest@localhost:5432/farmstand
        run: |
          # A drop open now, one 1-hour pickup window every 30 min (3 times), max 1 order per time
          start=$(date -u -d 'tomorrow 16:00' +'%Y-%m-%d %H:%M:%S')
          end=$(date -u -d 'tomorrow 17:00' +'%Y-%m-%d %H:%M:%S')
          psql "$PGURL" -v ON_ERROR_STOP=1 <<SQL
          INSERT INTO "Product" (id, name, price, "updatedAt") VALUES ('p1', 'Test Item', 500, now());
          INSERT INTO "Drop" (id, title, "orderOpenAt", "orderCloseAt", status, "updatedAt")
            VALUES ('d1', 'Test Drop', now() - interval '1 day', now() + interval '1 day', 'OPEN', now());
          INSERT INTO "PickupSlot" (id, "dropId", label, "pickupDate", "endDate", location, address, "intervalMinutes", "maxPerTime")
            VALUES ('s1', 'd1', 'Test window', '$start', '$end', 'Testville, OH', 'SECRET-SLOT-ADDRESS', 30, 1);
          INSERT INTO "Setting" (key, value, "updatedAt") VALUES ('SITE_PICKUP_INFO', 'SECRET-SITE-ADDRESS', now());
          INSERT INTO "DropProduct" (id, "dropId", "productId", "quantityLimit") VALUES ('dp1', 'd1', 'p1', 10);
          SQL

          drop=$(curl -s http://localhost:3000/api/drops/d1)
          times=$(echo "$drop" | jq -r '.pickupSlots[0].times | length')
          first=$(echo "$drop" | jq -r '.pickupSlots[0].times[0].time')
          echo "window times: $times, first: $first"
          [ "$times" = "3" ] || { echo "Expected 3 times"; exit 1; }

          order() {
            curl -s -o /tmp/order.json -w '%{http_code}' -X POST http://localhost:3000/api/orders \
              -H 'Content-Type: application/json' \
              -d "{\"type\":\"DROP\",\"dropId\":\"d1\",\"pickupSlotId\":\"s1\",\"pickupTime\":\"$1\",\"paymentMethod\":\"VENMO\",\"guestName\":\"Test Customer\",\"guestEmail\":\"c@example.com\",\"items\":[{\"dropProductId\":\"dp1\",\"quantity\":1}]}"
          }
          c=$(curl -s -o /tmp/order.json -w '%{http_code}' -X POST http://localhost:3000/api/orders -H 'Content-Type: application/json' \
            -d "{\"type\":\"DROP\",\"dropId\":\"d1\",\"pickupSlotId\":\"s1\",\"pickupTime\":\"$first\",\"paymentMethod\":\"VENMO\",\"guestEmail\":\"c@example.com\",\"items\":[{\"dropProductId\":\"dp1\",\"quantity\":1}]}")
          echo "pre-order without a name -> $c $(cat /tmp/order.json)"; [ "$c" = "400" ] || exit 1
          c=$(order "$first"); echo "order at first time -> $c $(cat /tmp/order.json)"; [ "$c" = "200" ] || exit 1
          n=$(psql "$PGURL" -tAc "SELECT \"guestName\" FROM \"Order\" WHERE id = '$(jq -r .orderId /tmp/order.json)'"); echo "saved name: $n"; [ "$n" = "Test Customer" ] || exit 1
          cp /tmp/order.json /tmp/order1.json
          full=$(curl -s http://localhost:3000/api/drops/d1 | jq -r '.pickupSlots[0].times[0].full')
          echo "first time full now: $full"; [ "$full" = "true" ] || exit 1
          c=$(order "$first"); echo "second order same time -> $c $(cat /tmp/order.json)"; [ "$c" = "400" ] || exit 1
          c=$(order "2000-01-01T00:00:00.000Z"); echo "order at bogus time -> $c $(cat /tmp/order.json)"; [ "$c" = "400" ] || exit 1
          sold=$(psql "$PGURL" -tAc 'SELECT "quantitySold" FROM "DropProduct" WHERE id = '"'"'dp1'"'"'')
          echo "quantitySold: $sold"; [ "$sold" = "1" ] || exit 1

          # Legal pages render the starter text
          for p in privacy terms; do
            curl -s "http://localhost:3000/$p" | grep -qi "reply STOP\|By placing an order" || { echo "/$p missing starter text"; exit 1; }
          done
          echo "legal pages ok"

          # Exact pickup address stays private until the order is paid
          for url in /api/drops/d1 /api/drops /api/settings/site /drops/d1 /farmstand /privacy /terms; do
            if curl -sL "http://localhost:3000$url" | grep -q 'SECRET-'; then echo "Address leaked at $url"; exit 1; fi
          done
          echo "address hidden from public pages and APIs"
          oid=$(jq -r .orderId /tmp/order1.json)
          p=$(curl -s "http://localhost:3000/api/orders/$oid/pickup"); echo "pickup before paid: $p"
          echo "$p" | grep -q '"paid":false' || exit 1
          psql "$PGURL" -c "UPDATE \"Order\" SET status = 'PAID' WHERE id = '$oid'"
          p=$(curl -s "http://localhost:3000/api/orders/$oid/pickup"); echo "pickup after paid: $p"
          echo "$p" | grep -q 'SECRET-SLOT-ADDRESS' || exit 1
          c=$(curl -s -o /dev/null -w '%{http_code}' "http://localhost:3000/api/orders/$oid")
          echo "GET full order while signed out -> $c"; [ "$c" = "401" ] || exit 1

      - name: Discounts, reviews, admin sign-in check
        env:
          PGURL: postgresql://farmstand:smoketest@localhost:5432/farmstand
        run: |
          psql "$PGURL" -v ON_ERROR_STOP=1 <<SQL
          INSERT INTO "DiscountCode" (id, code, type, value, "maxUses", "updatedAt") VALUES ('dc1', 'TEST10', 'PERCENT', 10, 1, now());
          INSERT INTO "Review" (id, name, rating, body, products, reply, "updatedAt") VALUES ('r1', 'Shown', 5, 'Great', 'Roll A, Roll B', 'Thank you!', now());
          INSERT INTO "Review" (id, name, rating, body, visible, "updatedAt") VALUES ('r2', 'Hidden', 3, 'Meh', false, now());
          SQL
          second=$(curl -s http://localhost:3000/api/drops/d1 | jq -r '.pickupSlots[0].times[1].time')
          third=$(curl -s http://localhost:3000/api/drops/d1 | jq -r '.pickupSlots[0].times[2].time')
          order() {
            curl -s -o /tmp/o.json -w '%{http_code}' -X POST http://localhost:3000/api/orders -H 'Content-Type: application/json' \
              -d "{\"type\":\"DROP\",\"dropId\":\"d1\",\"pickupSlotId\":\"s1\",\"pickupTime\":\"$1\",\"discountCode\":\"$2\",\"paymentMethod\":\"VENMO\",\"guestName\":\"Test Customer\",\"guestEmail\":\"d@example.com\",\"items\":[{\"dropProductId\":\"dp1\",\"quantity\":1}]}"
          }
          c=$(order "$second" "test10"); echo "order with TEST10 -> $c $(cat /tmp/o.json)"; [ "$c" = "200" ] || exit 1
          [ "$(jq -r .total /tmp/o.json)" = "450" ] || { echo "Expected 10% off 500 = 450"; exit 1; }
          uses=$(psql "$PGURL" -tAc "SELECT uses FROM \"DiscountCode\" WHERE id = 'dc1'"); echo "TEST10 uses: $uses"; [ "$uses" = "1" ] || exit 1
          c=$(order "$third" "TEST10"); echo "second use of 1-use code -> $c $(cat /tmp/o.json)"; [ "$c" = "400" ] || exit 1
          chk=$(curl -s -X POST http://localhost:3000/api/discounts/check -H 'Content-Type: application/json' -d '{"code":"NOPE","type":"DROP","subtotal":1000}')
          echo "check bogus code: $chk"; echo "$chk" | grep -q '"valid":false' || exit 1
          c=$(curl -s -o /dev/null -w '%{http_code}' http://localhost:3000/api/discounts); echo "list codes signed out -> $c"; [ "$c" = "401" ] || exit 1

          n=$(curl -s http://localhost:3000/api/reviews | jq length); echo "public reviews: $n"; [ "$n" = "1" ] || exit 1
          reply=$(curl -s http://localhost:3000/api/reviews | jq -r '.[0].reply + " | " + .[0].products')
          echo "review reply/products: $reply"; [ "$reply" = "Thank you! | Roll A, Roll B" ] || exit 1

          a=$(curl -s -X POST http://localhost:3000/api/login/admin-check -H 'Content-Type: application/json' -d '{"email":"Owner@Example.com"}')
          b=$(curl -s -X POST http://localhost:3000/api/login/admin-check -H 'Content-Type: application/json' -d '{"email":"someone@example.com"}')
          echo "admin-check owner: $a, other: $b"
          echo "$a" | grep -q '"admin":true' || exit 1
          echo "$b" | grep -q '"admin":false' || exit 1

      - name: Gift cards
        env:
          PGURL: postgresql://farmstand:smoketest@localhost:5432/farmstand
        run: |
          psql "$PGURL" -v ON_ERROR_STOP=1 <<SQL
          INSERT INTO "GiftCertificate" (id, code, "initialAmount", balance, status, "updatedAt") VALUES ('g1', 'GIFT-TEST-0001', 300, 300, 'ACTIVE', now());
          INSERT INTO "GiftCertificate" (id, code, "initialAmount", balance, status, "updatedAt") VALUES ('g2', 'GIFT-TEST-0002', 1000, 1000, 'ACTIVE', now());
          INSERT INTO "FarmstandItem" (id, name, price, available, "quantityAvailable", "updatedAt") VALUES ('f1', 'Stand Item', 400, true, 10, now());
          SQL
          bal() { psql "$PGURL" -tAc "SELECT balance FROM \"GiftCertificate\" WHERE id = '$1'"; }

          # Partial: $5 drop item, $3 gift card -> $2 left to pay by Venmo, card drained
          third=$(curl -s http://localhost:3000/api/drops/d1 | jq -r '.pickupSlots[0].times[2].time')
          c=$(curl -s -o /tmp/g.json -w '%{http_code}' -X POST http://localhost:3000/api/orders -H 'Content-Type: application/json' \
            -d "{\"type\":\"DROP\",\"dropId\":\"d1\",\"pickupSlotId\":\"s1\",\"pickupTime\":\"$third\",\"giftCode\":\"gift-test-0001\",\"paymentMethod\":\"VENMO\",\"guestName\":\"Test Customer\",\"guestEmail\":\"g@example.com\",\"items\":[{\"dropProductId\":\"dp1\",\"quantity\":1}]}")
          echo "drop order with \$3 gift card -> $c $(cat /tmp/g.json)"; [ "$c" = "200" ] || exit 1
          [ "$(jq -r .total /tmp/g.json)" = "200" ] || { echo "Expected 500 - 300 = 200"; exit 1; }
          echo "GIFT-TEST-0001 balance: $(bal g1)"; [ "$(bal g1)" = "0" ] || exit 1

          # Fully covered at the farmstand -> paid straight away, $6 left on the card
          c=$(curl -s -o /tmp/g.json -w '%{http_code}' -X POST http://localhost:3000/api/orders -H 'Content-Type: application/json' \
            -d '{"type":"FARMSTAND","giftCode":"GIFT-TEST-0002","paymentMethod":"STRIPE","items":[{"farmstandItemId":"f1","quantity":1}]}')
          echo "farmstand order fully on gift card -> $c $(cat /tmp/g.json)"; [ "$c" = "200" ] || exit 1
          [ "$(jq -r .status /tmp/g.json)" = "PAID" ] || { echo "Expected PAID"; exit 1; }
          echo "GIFT-TEST-0002 balance: $(bal g2)"; [ "$(bal g2)" = "600" ] || exit 1

          # Empty card is refused
          chk=$(curl -s -X POST http://localhost:3000/api/gift-cards/check -H 'Content-Type: application/json' -d '{"code":"GIFT-TEST-0001","amountDue":500}')
          echo "check empty card: $chk"; echo "$chk" | grep -q '"valid":false' || exit 1

          # Buying one online: pending until paid, so its code can't be used yet
          c=$(curl -s -o /tmp/buy.json -w '%{http_code}' -X POST http://localhost:3000/api/gift-cards/purchase -H 'Content-Type: application/json' \
            -d '{"amount":2500,"paymentMethod":"VENMO","purchaserEmail":"buyer@example.com","recipientEmail":"friend@example.com","recipientName":"Friend"}')
          echo "buy gift card -> $c $(cat /tmp/buy.json)"; [ "$c" = "200" ] || exit 1
          oid=$(jq -r .orderId /tmp/buy.json)
          code=$(psql "$PGURL" -tAc "SELECT code FROM \"GiftCertificate\" WHERE \"orderId\" = '$oid'")
          st=$(psql "$PGURL" -tAc "SELECT status FROM \"GiftCertificate\" WHERE \"orderId\" = '$oid'")
          echo "bought card $code is $st"; [ "$st" = "PENDING" ] || exit 1
          chk=$(curl -s -X POST http://localhost:3000/api/gift-cards/check -H 'Content-Type: application/json' -d "{\"code\":\"$code\",\"amountDue\":500}")
          echo "check unpaid card: $chk"; echo "$chk" | grep -q '"valid":false' || exit 1
          c=$(curl -s -o /dev/null -w '%{http_code}' http://localhost:3000/api/gift-cards); echo "list gift cards signed out -> $c"; [ "$c" = "401" ] || exit 1

      - name: Mix & match boxes
        env:
          PGURL: postgresql://farmstand:smoketest@localhost:5432/farmstand
        run: |
          # A 6-cookie box from 3 flavors, 3 boxes available, in a drop without pickup windows
          psql "$PGURL" -v ON_ERROR_STOP=1 <<SQL
          INSERT INTO "Product" (id, name, price, "boxSize", "boxOptions", "updatedAt")
            VALUES ('p2', 'Cookie Box', 1800, 6, ARRAY['Chocolate Chip','Snickerdoodle','Oatmeal'], now());
          INSERT INTO "Drop" (id, title, "orderOpenAt", "orderCloseAt", status, "updatedAt")
            VALUES ('d2', 'Box Drop', now() - interval '1 day', now() + interval '1 day', 'OPEN', now());
          INSERT INTO "DropProduct" (id, "dropId", "productId", "quantityLimit") VALUES ('dp2', 'd2', 'p2', 3);
          SQL
          box() {
            curl -s -o /tmp/b.json -w '%{http_code}' -X POST http://localhost:3000/api/orders -H 'Content-Type: application/json' \
              -d "{\"type\":\"DROP\",\"dropId\":\"d2\",\"paymentMethod\":\"VENMO\",\"guestName\":\"Test Customer\",\"guestEmail\":\"b@example.com\",\"items\":$1}"
          }
          A='{"name":"Chocolate Chip","quantity":4}'; B='{"name":"Snickerdoodle","quantity":2}'
          c=$(box "[{\"dropProductId\":\"dp2\",\"quantity\":1,\"selections\":[{\"name\":\"Chocolate Chip\",\"quantity\":5}]}]")
          echo "box with 5 of 6 -> $c $(cat /tmp/b.json)"; [ "$c" = "400" ] || exit 1
          c=$(box "[{\"dropProductId\":\"dp2\",\"quantity\":1,\"selections\":[{\"name\":\"Pizza\",\"quantity\":6}]}]")
          echo "box with unknown flavor -> $c $(cat /tmp/b.json)"; [ "$c" = "400" ] || exit 1
          c=$(box "[{\"dropProductId\":\"dp2\",\"quantity\":1}]")
          echo "box without picks -> $c $(cat /tmp/b.json)"; [ "$c" = "400" ] || exit 1
          # Two identical boxes (sent as separate lines) + one different = 3 boxes, 2 order lines
          c=$(box "[{\"dropProductId\":\"dp2\",\"quantity\":1,\"selections\":[$A,$B]},{\"dropProductId\":\"dp2\",\"quantity\":1,\"selections\":[$B,$A]},{\"dropProductId\":\"dp2\",\"quantity\":1,\"selections\":[{\"name\":\"Oatmeal\",\"quantity\":6}]}]")
          echo "three boxes -> $c $(cat /tmp/b.json)"; [ "$c" = "200" ] || exit 1
          [ "$(jq -r .total /tmp/b.json)" = "5400" ] || { echo "Expected 3 x 1800"; exit 1; }
          oid=$(jq -r .orderId /tmp/b.json)
          lines=$(psql "$PGURL" -tAc "SELECT count(*) FROM \"OrderItem\" WHERE \"orderId\" = '$oid'"); echo "order lines: $lines"; [ "$lines" = "2" ] || exit 1
          picks=$(psql "$PGURL" -tAc "SELECT selections::text FROM \"OrderItem\" WHERE \"orderId\" = '$oid' AND quantity = 2")
          echo "saved picks: $picks"; echo "$picks" | grep -q '"Chocolate Chip"' || exit 1
          sold=$(psql "$PGURL" -tAc "SELECT \"quantitySold\" FROM \"DropProduct\" WHERE id = 'dp2'"); echo "boxes sold: $sold"; [ "$sold" = "3" ] || exit 1
          c=$(box "[{\"dropProductId\":\"dp2\",\"quantity\":1,\"selections\":[{\"name\":\"Oatmeal\",\"quantity\":6}]}]")
          echo "fourth box when 3 available -> $c $(cat /tmp/b.json)"; [ "$c" = "400" ] || exit 1
          # This drop only offers 2 of the 3 flavors
          psql "$PGURL" -c "UPDATE \"DropProduct\" SET \"quantityLimit\" = 10, \"boxOptions\" = ARRAY['Chocolate Chip','Snickerdoodle'] WHERE id = 'dp2'"
          c=$(box "[{\"dropProductId\":\"dp2\",\"quantity\":1,\"selections\":[{\"name\":\"Oatmeal\",\"quantity\":6}]}]")
          echo "flavor not offered this drop -> $c $(cat /tmp/b.json)"; [ "$c" = "400" ] || exit 1
          c=$(box "[{\"dropProductId\":\"dp2\",\"quantity\":1,\"selections\":[$A,$B]}]")
          echo "flavors offered this drop -> $c $(cat /tmp/b.json)"; [ "$c" = "200" ] || exit 1

      - name: Drop alert sign-ups
        env:
          PGURL: postgresql://farmstand:smoketest@localhost:5432/farmstand
        run: |
          sub() { curl -s -o /tmp/s.json -w '%{http_code}' -X POST http://localhost:3000/api/subscribe -H 'Content-Type: application/json' -d "$1"; }
          c=$(sub '{"email":"Fan@Example.com"}'); echo "sign up -> $c"; [ "$c" = "200" ] || exit 1
          c=$(sub '{"email":"fan@example.com","phone":"(555) 123-4567"}'); echo "same email again -> $c"; [ "$c" = "200" ] || exit 1
          c=$(sub '{"email":"not-an-email"}'); echo "bad email -> $c"; [ "$c" = "400" ] || exit 1
          n=$(psql "$PGURL" -tAc "SELECT count(*) FROM \"Subscriber\""); echo "subscribers: $n"; [ "$n" = "1" ] || exit 1
          phone=$(psql "$PGURL" -tAc "SELECT phone FROM \"Subscriber\""); echo "phone saved: $phone"; [ "$phone" = "5551234567" ] || exit 1
          c=$(curl -s -o /dev/null -w '%{http_code}' http://localhost:3000/api/subscribers); echo "list signed out -> $c"; [ "$c" = "401" ] || exit 1
          c=$(curl -s -o /dev/null -w '%{http_code}' -X POST -H 'Content-Type: application/json' -d '{"email":"x@example.com"}' http://localhost:3000/api/subscribers); echo "admin add signed out -> $c"; [ "$c" = "401" ] || exit 1
          # Just opening the unsubscribe link (as email scanners do) must not remove anyone
          token=$(psql "$PGURL" -tAc "SELECT \"unsubscribeToken\" FROM \"Subscriber\"")
          curl -s "http://localhost:3000/unsubscribe?token=$token" | grep -q "Stop drop alerts" || { echo "unsubscribe page missing"; exit 1; }
          n=$(psql "$PGURL" -tAc "SELECT count(*) FROM \"Subscriber\""); echo "after opening link: $n"; [ "$n" = "1" ] || exit 1

      - name: Customer reviews
        env:
          PGURL: postgresql://farmstand:smoketest@localhost:5432/farmstand
        run: |
          # Two picked-up orders from the same customer, each with a review link
          psql "$PGURL" -v ON_ERROR_STOP=1 <<SQL
          INSERT INTO "Order" (id, type, "dropId", status, subtotal, total, "guestEmail", "reviewToken", "updatedAt")
            VALUES ('ro1', 'DROP', 'd1', 'PICKED_UP', 500, 500, 'Reviewer@Example.com', 'tok-one', now()),
                   ('ro2', 'DROP', 'd1', 'PICKED_UP', 500, 500, 'reviewer@example.com', 'tok-two', now());
          INSERT INTO "OrderItem" (id, "orderId", "dropProductId", quantity, "priceAtPurchase") VALUES ('roi1', 'ro1', 'dp1', 1, 500);
          SQL
          rev() { curl -s -o /tmp/r.json -w '%{http_code}' -X POST http://localhost:3000/api/reviews/submit -H 'Content-Type: application/json' -d "$1"; }
          c=$(curl -s -o /tmp/page.html -w '%{http_code}' "http://localhost:3000/review?token=tok-one"); echo "review page -> $c"
          grep -q "first review" /tmp/page.html || { echo "first-review offer missing"; exit 1; }
          c=$(rev '{"token":"nope","rating":5,"body":"Yum","name":"Sam"}'); echo "bad token -> $c"; [ "$c" = "400" ] || exit 1
          c=$(rev '{"token":"tok-one","rating":5,"body":"So good","name":"Sam","products":["Test Item","Not On Order"]}')
          echo "first review -> $c $(cat /tmp/r.json)"; [ "$c" = "200" ] || exit 1
          code=$(jq -r .code /tmp/r.json); echo "$code" | grep -q '^THANKS-' || { echo "no reward code"; exit 1; }
          dc=$(psql "$PGURL" -tAc "SELECT type || ' ' || value || ' ' || \"maxUses\" FROM \"DiscountCode\" WHERE code = '$code'")
          echo "reward code: $dc"; [ "$dc" = "PERCENT 10 1" ] || exit 1
          tags=$(psql "$PGURL" -tAc "SELECT products || ' ' || visible FROM \"Review\" WHERE \"orderId\" = 'ro1'")
          echo "tags/visible: $tags"; [ "$tags" = "Test Item false" ] || exit 1
          c=$(rev '{"token":"tok-one","rating":4,"body":"Again","name":"Sam"}'); echo "same order twice -> $c"; [ "$c" = "400" ] || exit 1
          c=$(rev '{"token":"tok-two","rating":5,"body":"Still good","name":"Sam"}'); echo "second review -> $c $(cat /tmp/r.json)"; [ "$c" = "200" ] || exit 1
          [ "$(jq -r .code /tmp/r.json)" = "null" ] || { echo "second review should not get a code"; exit 1; }
          # Hidden until approved, and the public list never shows emails
          curl -s http://localhost:3000/api/reviews | grep -q "So good" && { echo "unapproved review is public"; exit 1; }
          psql "$PGURL" -c "UPDATE \"Review\" SET visible = true WHERE \"orderId\" = 'ro1'"
          pub=$(curl -s http://localhost:3000/api/reviews); echo "$pub" | grep -q "So good" || exit 1
          echo "$pub" | grep -qi "reviewer@example.com" && { echo "email leaked"; exit 1; }
          echo "reviews ok"

      - name: Personal discount codes
        env:
          PGURL: postgresql://farmstand:smoketest@localhost:5432/farmstand
        run: |
          psql "$PGURL" -c "INSERT INTO \"DiscountCode\" (id, code, type, value, \"allowedEmails\", \"updatedAt\") VALUES ('dc2', 'SAM10', 'PERCENT', 10, ARRAY['sam@example.com'], now())"
          box='[{"dropProductId":"dp2","quantity":1,"selections":[{"name":"Chocolate Chip","quantity":6}]}]'
          pc() { curl -s -o /tmp/pc.json -w '%{http_code}' -X POST http://localhost:3000/api/orders -H 'Content-Type: application/json' \
            -d "{\"type\":\"DROP\",\"dropId\":\"d2\",\"discountCode\":\"SAM10\",\"paymentMethod\":\"VENMO\",\"guestName\":\"Test\",\"guestEmail\":\"$1\",\"items\":$box}"; }
          c=$(pc "someone@example.com"); echo "personal code, wrong email -> $c $(cat /tmp/pc.json)"; [ "$c" = "400" ] || exit 1
          c=$(pc "Sam@Example.com"); echo "personal code, right email -> $c $(cat /tmp/pc.json)"; [ "$c" = "200" ] || exit 1
          [ "$(jq -r .total /tmp/pc.json)" = "1620" ] || { echo "Expected 10% off 1800"; exit 1; }
          chk=$(curl -s -X POST http://localhost:3000/api/discounts/check -H 'Content-Type: application/json' -d '{"code":"SAM10","type":"DROP","subtotal":1000}')
          echo "check without email: $chk"; echo "$chk" | grep -q '"valid":false' || exit 1
          echo "$chk" | grep -q '"needsEmail":true' || { echo "checkout should ask for the email"; exit 1; }

      - name: Draft drops, review photos, card check
        env:
          PGURL: postgresql://farmstand:smoketest@localhost:5432/farmstand
        run: |
          psql "$PGURL" -c "INSERT INTO \"Drop\" (id, title, \"orderOpenAt\", \"orderCloseAt\", status, \"updatedAt\") VALUES ('dd', 'Secret Draft', now(), now() + interval '1 day', 'DRAFT', now())"
          c=$(curl -s -o /dev/null -w '%{http_code}' http://localhost:3000/api/drops/dd); echo "draft drop signed out -> $c"; [ "$c" = "404" ] || exit 1
          curl -s http://localhost:3000/api/drops | grep -q "Secret Draft" && { echo "draft listed publicly"; exit 1; }
          c=$(curl -s -o /dev/null -w '%{http_code}' -F "file=@/dev/null;type=image/png" http://localhost:3000/api/upload); echo "upload without login or review link -> $c"; [ "$c" = "401" ] || exit 1
          c=$(curl -s -o /dev/null -w '%{http_code}' -F "file=@/dev/null;type=image/png" -F "reviewToken=bogus" http://localhost:3000/api/upload); echo "upload with bad review link -> $c"; [ "$c" = "401" ] || exit 1
          c=$(curl -s -o /dev/null -w '%{http_code}' -X POST http://localhost:3000/api/drops/d1/remind); echo "send reminder signed out -> $c"; [ "$c" = "401" ] || exit 1
          c=$(curl -s -o /dev/null -w '%{http_code}' http://localhost:3000/api/settings/reminders); echo "reminder settings signed out -> $c"; [ "$c" = "401" ] || exit 1
          n=$(psql "$PGURL" -tAc "SELECT count(*) FROM information_schema.columns WHERE table_name = 'Drop' AND column_name = 'reminderSentAt'"); [ "$n" = "1" ] || { echo "reminderSentAt column missing"; exit 1; }
          c=$(curl -s -o /dev/null -w '%{http_code}' -X POST http://localhost:3000/api/orders/nope/hosted-checkout); echo "Stripe page for unknown order -> $c"; [ "$c" = "404" ] || exit 1
          c=$(curl -s -o /dev/null -w '%{http_code}' "http://localhost:3000/order-paid?order=nope&session=cs_x"); echo "/order-paid -> $c"; [ "$c" = "200" ] || exit 1
          r=$(curl -s -X POST http://localhost:3000/api/orders/nope/card-paid); echo "card check unknown order -> $r"; echo "$r" | grep -q '"paid":false' || exit 1
          n=$(psql "$PGURL" -tAc "SELECT count(*) FROM information_schema.columns WHERE table_name = 'Review' AND column_name = 'images'"); [ "$n" = "1" ] || { echo "images column missing"; exit 1; }

      - name: Walk-up open hours and its alert list
        env:
          PGURL: postgresql://farmstand:smoketest@localhost:5432/farmstand
        run: |
          r=$(curl -s http://localhost:3000/api/stand-hours); echo "open hours: $r"; [ "$r" = "[]" ] || exit 1
          c=$(curl -s -o /dev/null -w '%{http_code}' -X POST -H 'Content-Type: application/json' -d '{"startsAt":"2030-01-01T14:00:00Z","endsAt":"2030-01-01T18:00:00Z"}' http://localhost:3000/api/stand-hours); echo "add hours signed out -> $c"; [ "$c" = "401" ] || exit 1
          c=$(curl -s -o /dev/null -w '%{http_code}' -X POST http://localhost:3000/api/stand-hours/notify); echo "notify signed out -> $c"; [ "$c" = "401" ] || exit 1
          psql "$PGURL" -c "INSERT INTO \"StandHours\" (id, \"startsAt\", \"endsAt\") VALUES ('sh1', now() + interval '1 day', now() + interval '1 day 4 hours'), ('sh0', now() - interval '2 days', now() - interval '1 day')"
          n=$(curl -s http://localhost:3000/api/stand-hours | jq length); echo "upcoming hours: $n"; [ "$n" = "1" ] || exit 1
          c=$(curl -s -o /tmp/s.json -w '%{http_code}' -X POST -H 'Content-Type: application/json' -d '{"list":"stand","phone":"(555) 888-1212"}' http://localhost:3000/api/subscribe); echo "porch alerts phone-only -> $c $(cat /tmp/s.json)"; [ "$c" = "200" ] || exit 1
          f=$(psql "$PGURL" -tAc "SELECT \"dropAlerts\"::text || ' ' || \"standAlerts\"::text || ' ' || \"standVia\" FROM \"Subscriber\" WHERE phone = '5558881212'"); echo "lists: $f"; [ "$f" = "false true text" ] || exit 1
          c=$(curl -s -o /dev/null -w '%{http_code}' -X POST -H 'Content-Type: application/json' -d '{"list":"stand","via":"both","phone":"5558881213"}' http://localhost:3000/api/subscribe); echo "both without email -> $c"; [ "$c" = "400" ] || exit 1
          c=$(curl -s -o /dev/null -w '%{http_code}' -X POST -H 'Content-Type: application/json' -d '{"list":"stand","via":"email","email":"porch@example.com"}' http://localhost:3000/api/subscribe); echo "email only -> $c"; [ "$c" = "200" ] || exit 1
          c=$(curl -s -o /dev/null -w '%{http_code}' -X POST -H 'Content-Type: application/json' -d '{"phone":"5558881212"}' http://localhost:3000/api/subscribe); echo "drop alerts without email -> $c"; [ "$c" = "400" ] || exit 1
          c=$(curl -s -o /dev/null -w '%{http_code}' -X POST -H 'Content-Type: application/json' -d '{"via":"text","phone":"5558881299"}' http://localhost:3000/api/subscribe); echo "drop alerts by text only -> $c"; [ "$c" = "200" ] || exit 1
          f=$(psql "$PGURL" -tAc "SELECT \"dropAlerts\"::text || ' ' || \"dropVia\" FROM \"Subscriber\" WHERE phone = '5558881299'"); echo "drop choice: $f"; [ "$f" = "true text" ] || exit 1
          c=$(curl -s -o /dev/null -w '%{http_code}' -X POST -H 'Content-Type: application/json' -d '{"via":"both","email":"both@example.com"}' http://localhost:3000/api/subscribe); echo "drop both without phone -> $c"; [ "$c" = "400" ] || exit 1

      - name: Editable text and walk-up page address
        env:
          PGURL: postgresql://farmstand:smoketest@localhost:5432/farmstand
        run: |
          psql "$PGURL" -v ON_ERROR_STOP=1 <<'SQL'
          INSERT INTO "Setting" (key, value, "updatedAt") VALUES
            ('SITE_FARMSTAND_PATH', 'porch-pickup', now()),
            ('SITE_COPY', '{"giftPage.title":"Treat Someone Today"}', now());
          SQL
          for p in /porch-pickup /farmstand; do
            c=$(curl -s -o /dev/null -w '%{http_code}' "http://localhost:3000$p"); echo "GET $p -> $c"; [ "$c" = "200" ] || exit 1
          done
          c=$(curl -s -o /dev/null -w '%{http_code}' http://localhost:3000/not-a-page); echo "GET /not-a-page -> $c"; [ "$c" = "404" ] || exit 1
          # The gift page renders in full on the server (the home page redirects to /setup in CI)
          page=$(curl -s http://localhost:3000/gift)
          echo "$page" | grep -q ">Treat Someone Today</h1>" || { echo "edited text not shown"; exit 1; }
          echo "$page" | grep -q 'href="/porch-pickup"' || { echo "links don't use the new address"; exit 1; }

      - name: Text STOP / START
        env:
          PGURL: postgresql://farmstand:smoketest@localhost:5432/farmstand
        run: |
          psql "$PGURL" -v ON_ERROR_STOP=1 <<SQL
          INSERT INTO "Setting" (key, value, "updatedAt") VALUES ('N8N_WEBHOOK_SECRET', 'ci-secret', now());
          INSERT INTO "Subscriber" (id, phone, "unsubscribeToken") VALUES ('sp1', '5557770000', 'tok-sp1');
          SQL
          sms() { curl -s -o /tmp/sms.json -w '%{http_code}' -X POST http://localhost:3000/api/sms/inbound -H 'Content-Type: application/json' -H "x-webhook-secret: $1" -d "$2"; }
          c=$(sms wrong '{"phone":"+15557770000","text":"STOP"}'); echo "wrong secret -> $c"; [ "$c" = "401" ] || exit 1
          c=$(sms ci-secret '{"phone":"+15557770000","text":"Thanks!"}'); echo "normal reply -> $(cat /tmp/sms.json)"; grep -q '"none"' /tmp/sms.json || exit 1
          [ "$(psql "$PGURL" -tAc "SELECT body FROM \"SmsMessage\" WHERE phone = '5557770000' AND direction = 'IN' LIMIT 1")" = "Thanks!" ] || { echo "text not saved to inbox"; exit 1; }
          c=$(curl -s -o /dev/null -w '%{http_code}' http://localhost:3000/api/messages); echo "inbox signed out -> $c"; [ "$c" = "401" ] || exit 1
          c=$(sms ci-secret '{"phone":"+1 (555) 777-0000","text":" stop "}'); echo "STOP -> $(cat /tmp/sms.json)"; grep -q '"stop"' /tmp/sms.json || exit 1
          [ "$(psql "$PGURL" -tAc "SELECT count(*) FROM \"SmsOptOut\" WHERE phone = '5557770000'")" = "1" ] || { echo "not opted out"; exit 1; }
          [ "$(psql "$PGURL" -tAc "SELECT count(*) FROM \"Subscriber\" WHERE id = 'sp1'")" = "0" ] || { echo "still on alerts"; exit 1; }
          c=$(sms ci-secret '{"phone":"5557770000","text":"START"}'); echo "START -> $(cat /tmp/sms.json)"; grep -q '"start"' /tmp/sms.json || exit 1
          [ "$(psql "$PGURL" -tAc "SELECT count(*) FROM \"SmsOptOut\"")" = "0" ] || { echo "still opted out"; exit 1; }

      - name: Product add-ons
        env:
          PGURL: postgresql://farmstand:smoketest@localhost:5432/farmstand
        run: |
          psql "$PGURL" -v ON_ERROR_STOP=1 <<SQL
          INSERT INTO "Product" (id, name, price, "addOns", "updatedAt") VALUES ('p3', 'Cinnamon Roll', 500, '[{"name":"Extra icing","price":100}]', now());
          INSERT INTO "DropProduct" (id, "dropId", "productId") VALUES ('dp3', 'd2', 'p3');
          SQL
          ao() { curl -s -o /tmp/ao.json -w '%{http_code}' -X POST http://localhost:3000/api/orders -H 'Content-Type: application/json' \
            -d "{\"type\":\"DROP\",\"dropId\":\"d2\",\"paymentMethod\":\"VENMO\",\"guestName\":\"Test\",\"guestEmail\":\"ao@example.com\",\"items\":$1}"; }
          c=$(ao '[{"dropProductId":"dp3","quantity":2,"addOns":["Extra icing"]},{"dropProductId":"dp3","quantity":1}]')
          echo "rolls with and without icing -> $c $(cat /tmp/ao.json)"; [ "$c" = "200" ] || exit 1
          [ "$(jq -r .total /tmp/ao.json)" = "1700" ] || { echo "Expected 2x600 + 500"; exit 1; }
          c=$(ao '[{"dropProductId":"dp3","quantity":1,"addOns":["Sprinkles"]}]'); echo "unknown add-on -> $c"; [ "$c" = "400" ] || exit 1

      - name: Container logs
        if: always()
        run: docker logs farmstand || true

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Push image
        run: |
          for tag in $(echo "${{ steps.meta.outputs.tags }}"); do
            docker push "$tag"
          done
