name: Build Docker image

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  packages: write


jobs:
  build:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: farmstand
          POSTGRES_PASSWORD: smoketest
          POSTGRES_DB: farmstand
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U farmstand -d farmstand"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    steps:
      - uses: actions/checkout@v4

      # ghcr.io/<owner>/<repo>, lowercase — works for any fork
      - name: Image name
        run: echo "IMAGE=ghcr.io/${GITHUB_REPOSITORY,,}" >> "$GITHUB_ENV"

      - uses: docker/setup-buildx-action@v3

      - id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.IMAGE }}
          tags: |
            type=raw,value=latest
            type=sha

      # Build into the local Docker daemon first so it can be smoke-tested
      - uses: docker/build-push-action@v6
        with:
          context: .
          load: true
          build-args: |
            APP_VERSION=${{ github.sha }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Smoke test (migrations + pages respond)
        run: |
          # Root-owned host folder, like a fresh Unraid appdata bind mount
          sudo mkdir -p /tmp/uploads && sudo chown root:root /tmp/uploads && sudo chmod 755 /tmp/uploads
          docker run -d --name farmstand --network host \
            -v /tmp/uploads:/app/public/uploads \
            -e DATABASE_URL="postgresql://farmstand:smoketest@localhost:5432/farmstand?schema=public" \
            -e AUTH_SECRET="smoke-test-secret-not-used-anywhere-else" \
            -e AUTH_TRUST_HOST=true \
            -e ADMIN_EMAIL=owner@example.com \
            -e NEXTAUTH_URL="http://localhost:3000" \
            "${IMAGE}:latest"

          for i in $(seq 1 30); do
            if curl -s -o /dev/null http://localhost:3000/; then break; fi
            if [ "$(docker inspect -f '{{.State.Running}}' farmstand)" != "true" ]; then
              echo "Container exited"; exit 1
            fi
            sleep 2
          done

          # The app user (PUID:PGID 99:100) must be able to write uploads
          docker exec -u 99:100 farmstand touch /app/public/uploads/.write-test
          echo "Uploads dir writable by 99:100"

          health=$(curl -s http://localhost:3000/api/health)
          echo "GET /api/health -> ${health}"
          echo "$health" | grep -q "${GITHUB_SHA}" || { echo "Image reports wrong version"; exit 1; }

          # Runs before setup is done: static files must not hit the first-run redirect
          icon=$(curl -s -o /dev/null -w '%{http_code} %{content_type}' http://localhost:3000/icon.png)
          echo "GET /icon.png -> ${icon}"
          if [ "$icon" != "200 image/png" ]; then exit 1; fi

          # Installable app (PWA): manifest, generated icons, service worker
          manifest=$(curl -s http://localhost:3000/manifest.webmanifest)
          echo "manifest: ${manifest}" | head -c 300; echo
          echo "$manifest" | grep -q '"display":"standalone"' || { echo "Bad manifest"; exit 1; }
          echo "$manifest" | grep -q '"start_url":"/admin"' || { echo "Manifest should open /admin"; exit 1; }
          for icon_path in "/pwa-icon/192" "/pwa-icon/512?maskable=1" "/pwa-icon/180"; do
            r=$(curl -s -o /dev/null -w '%{http_code} %{content_type}' "http://localhost:3000${icon_path}")
            echo "GET ${icon_path} -> ${r}"
            [ "$r" = "200 image/png" ] || exit 1
          done
          links=$(curl -s http://localhost:3000/.well-known/assetlinks.json)
          echo "GET /.well-known/assetlinks.json -> ${links}"
          [ "$links" = "[]" ] || exit 1
          sw=$(curl -s -o /dev/null -w '%{http_code}' http://localhost:3000/sw.js)
          echo "GET /sw.js -> ${sw}"
          [ "$sw" = "200" ] || exit 1

          # Setup wizard must refuse emails that aren't ADMIN_EMAIL
          code=$(curl -s -o /tmp/setup.json -w '%{http_code}' -X POST http://localhost:3000/api/setup \
            -H 'Content-Type: application/json' \
            -d '{"adminEmail":"intruder@example.com","adminName":"X","appUrl":"http://localhost:3000"}')
          echo "POST /api/setup (wrong email) -> ${code} $(cat /tmp/setup.json)"
          [ "$code" = "403" ] || exit 1

          for path in / /setup; do
            code=$(curl -s -o /dev/null -w '%{http_code}' "http://localhost:3000${path}")
            echo "GET ${path} -> ${code}"
            if [ "$code" = "000" ] || [ "$code" -ge 500 ]; then exit 1; fi
          done

          # Tailwind must actually be compiled into the served stylesheet
          css_path=$(curl -sL http://localhost:3000/ | grep -o '/_next/static/[^"]*\.css' | head -n 1)
          if [ -z "$css_path" ]; then echo "No stylesheet linked from /"; exit 1; fi
          css=$(curl -s "http://localhost:3000${css_path}")
          echo "Stylesheet ${css_path}: ${#css} bytes"
          for cls in '.flex{' '.rounded-xl{'; do
            if ! printf '%s' "$css" | grep -qF "$cls"; then
              echo "Stylesheet is missing ${cls} - Tailwind did not compile"; exit 1
            fi
          done

      - name: Pickup time slots (seeded drop, real orders)
        env:
          PGURL: postgresql://farmstand:smoketest@localhost:5432/farmstand
        run: |
          # A drop open now, one 1-hour pickup window every 30 min (3 times), max 1 order per time
          start=$(date -u -d 'tomorrow 16:00' +'%Y-%m-%d %H:%M:%S')
          end=$(date -u -d 'tomorrow 17:00' +'%Y-%m-%d %H:%M:%S')
          psql "$PGURL" -v ON_ERROR_STOP=1 <<SQL
          INSERT INTO "Product" (id, name, price, "updatedAt") VALUES ('p1', 'Test Item', 500, now());
          INSERT INTO "Drop" (id, title, "orderOpenAt", "orderCloseAt", status, "updatedAt")
            VALUES ('d1', 'Test Drop', now() - interval '1 day', now() + interval '1 day', 'OPEN', now());
          INSERT INTO "PickupSlot" (id, "dropId", label, "pickupDate", "endDate", location, address, "intervalMinutes", "maxPerTime")
            VALUES ('s1', 'd1', 'Test window', '$start', '$end', 'Testville, OH', 'SECRET-SLOT-ADDRESS', 30, 1);
          INSERT INTO "Setting" (key, value, "updatedAt") VALUES ('SITE_PICKUP_INFO', 'SECRET-SITE-ADDRESS', now());
          INSERT INTO "DropProduct" (id, "dropId", "productId", "quantityLimit") VALUES ('dp1', 'd1', 'p1', 10);
          SQL

          drop=$(curl -s http://localhost:3000/api/drops/d1)
          times=$(echo "$drop" | jq -r '.pickupSlots[0].times | length')
          first=$(echo "$drop" | jq -r '.pickupSlots[0].times[0].time')
          echo "window times: $times, first: $first"
          [ "$times" = "3" ] || { echo "Expected 3 times"; exit 1; }

          order() {
            curl -s -o /tmp/order.json -w '%{http_code}' -X POST http://localhost:3000/api/orders \
              -H 'Content-Type: application/json' \
              -d "{\"type\":\"DROP\",\"dropId\":\"d1\",\"pickupSlotId\":\"s1\",\"pickupTime\":\"$1\",\"paymentMethod\":\"VENMO\",\"guestEmail\":\"c@example.com\",\"items\":[{\"dropProductId\":\"dp1\",\"quantity\":1}]}"
          }
          c=$(order "$first"); echo "order at first time -> $c $(cat /tmp/order.json)"; [ "$c" = "200" ] || exit 1
          cp /tmp/order.json /tmp/order1.json
          full=$(curl -s http://localhost:3000/api/drops/d1 | jq -r '.pickupSlots[0].times[0].full')
          echo "first time full now: $full"; [ "$full" = "true" ] || exit 1
          c=$(order "$first"); echo "second order same time -> $c $(cat /tmp/order.json)"; [ "$c" = "400" ] || exit 1
          c=$(order "2000-01-01T00:00:00.000Z"); echo "order at bogus time -> $c $(cat /tmp/order.json)"; [ "$c" = "400" ] || exit 1
          sold=$(psql "$PGURL" -tAc 'SELECT "quantitySold" FROM "DropProduct" WHERE id = '"'"'dp1'"'"'')
          echo "quantitySold: $sold"; [ "$sold" = "1" ] || exit 1

          # Exact pickup address stays private until the order is paid
          for url in /api/drops/d1 /api/drops /api/settings/site /drops/d1 /farmstand; do
            if curl -sL "http://localhost:3000$url" | grep -q 'SECRET-'; then echo "Address leaked at $url"; exit 1; fi
          done
          echo "address hidden from public pages and APIs"
          oid=$(jq -r .orderId /tmp/order1.json)
          p=$(curl -s "http://localhost:3000/api/orders/$oid/pickup"); echo "pickup before paid: $p"
          echo "$p" | grep -q '"paid":false' || exit 1
          psql "$PGURL" -c "UPDATE \"Order\" SET status = 'PAID' WHERE id = '$oid'"
          p=$(curl -s "http://localhost:3000/api/orders/$oid/pickup"); echo "pickup after paid: $p"
          echo "$p" | grep -q 'SECRET-SLOT-ADDRESS' || exit 1
          c=$(curl -s -o /dev/null -w '%{http_code}' "http://localhost:3000/api/orders/$oid")
          echo "GET full order while signed out -> $c"; [ "$c" = "401" ] || exit 1

      - name: Container logs
        if: always()
        run: docker logs farmstand || true

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Push image
        run: |
          for tag in $(echo "${{ steps.meta.outputs.tags }}"); do
            docker push "$tag"
          done
